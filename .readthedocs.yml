version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    # Autodoc examples import pyrepl_test_pkg; cannot live in [docs] extra (PyPI rejects file: URLs).
    - method: pip
      path: tests/fixtures/pyrepl_test_pkg

sphinx:
   configuration: docs/conf.py
